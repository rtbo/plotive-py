[package]
name = "plotive-py"
version = "0.3.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "plotive"
crate-type = ["cdylib"]

[dependencies]
plotive = { path = "../../plotive", features = [
    "data-csv",
    "noto-mono",
    "noto-sans",
    "noto-sans-italic",
    "noto-serif",
    "noto-serif-italic",
    "time",
    "serde",
    "utils",
] }
plotive-iced = { path = "../../plotive/iced", features = ["clipboard", "data-csv"] }
plotive-text = { path = "../../plotive/text" }
plotive-pxl = { path = "../../plotive/pxl" }
plotive-svg = { path = "../../plotive/svg" }
numpy = "0.29.0"
pyo3 = { version = "0.29.0", features = ["serde"] }
pythonize = "0.29.0"
