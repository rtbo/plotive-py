[package]
name = "plotive-py"
version = "0.3.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "plotive"
crate-type = ["cdylib"]

[dependencies]
plotive = { version = "0.6.0", features = [
    "data-csv",
    "noto-mono",
    "noto-sans",
    "noto-sans-italic",
    "noto-serif",
    "noto-serif-italic",
    "time",
    "serde",
    "utils",
] }
plotive-iced = { version = "0.6.0", features = ["clipboard", "data-csv"] }
plotive-text = { version = "0.6.0" }
plotive-pxl = { version = "0.6.0" }
plotive-svg = { version = "0.6.0" }
numpy = "0.29.0"
pyo3 = { version = "0.29.0", features = ["serde"] }
pythonize = "0.29.0"
serde_json = "1.0.149"
woff2-patched = "0.4.0"
